name: goal_api
description: Dart SDK for the GOAL API - football fixtures, live scores, standings, stats and live WebSocket updates.
version: 1.1.0
repository: https://github.com/goal-api/goal-api-dart
homepage: https://goal-api.com
documentation: https://goal-api.com/documentation
issue_tracker: https://github.com/goal-api/goal-api-dart/issues

topics:
  - football
  - soccer
  - sports
  - api
  - live-scores

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  crypto: ^3.0.3

dev_dependencies:
  # Held at 4 on purpose. lints 5 needs Dart ^3.5.0 and lints 6 needs ^3.8.0, so
  # bumping it raises the sdk floor above and drops consumers on 3.4 to 3.7 — a
  # steep price for a linter that never ships to them. Raise both together, or
  # neither.
  lints: ^4.0.0
  test: ^1.25.0
